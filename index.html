<!DOCTYPE html>
<html lang="en">

<head>

  <!-- Menentukan encoding karakter yang digunakan -->
  <meta charset="UTF-8" />

  <!-- Menampilkan favicon pada tab browser -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Membuat tampilan responsif di berbagai ukuran layar -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Judul halaman yang muncul pada tab browser -->
  <title>Todo App</title>

</head>

<body>

  <!--
    Elemen root menjadi tempat React menampilkan seluruh aplikasi.
    Semua komponen React akan dirender ke dalam div ini.
  -->
  <div id="root"></div>

  <!--
    Memanggil file utama React.
    Vite akan menjalankan file index.jsx sebagai entry point aplikasi.
  -->
  <script type="module" src="/src/index.jsx"></script>

</body>

</html>
